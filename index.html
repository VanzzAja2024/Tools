<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANN MEDIA AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main App (Langsung Tampil Tanpa Start Screen) -->
    <div id="app" style="display: block;">
        <header>
            <h1>VANN MEDIA AI</h1>
            <p>ONLINE // SYSTEM READY</p>
        </header>

        <div class="grid">
            <div class="card">
                <div>
                    <h2>VIDEO TOOL</h2>
                    <p>TikTok Downloader System</p>
                </div>
                <button onclick="runFeature('tt')">OPEN</button>
            </div>

            <div class="card">
                <div>
                    <h2>MP3 ENGINE</h2>
                    <p>Convert Video To Audio</p>
                </div>
                <button onclick="runFeature('mp3')">OPEN</button>
            </div>

            <div class="card">
                <div>
                    <h2>AI BACKGROUND</h2>
                    <p>Remove Background</p>
                </div>
                <button onclick="runFeature('rbg')">OPEN</button>
            </div>

            <div class="card">
                <div>
                    <h2>HD BOOST</h2>
                    <p>Image Enhancement</p>
                </div>
                <button onclick="runFeature('hd')">OPEN</button>
            </div>
        </div>

        <div class="terminal" id="text">
            SYSTEM ONLINE - VANN CORE READY
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
